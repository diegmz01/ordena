name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_CUSTOMER_URL: http://localhost:3000
          NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
          NEXT_PUBLIC_BRANCH_URL: http://localhost:3002
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
          NEXT_PUBLIC_PUSHER_KEY: ci-key
          NEXT_PUBLIC_PUSHER_CLUSTER: us2
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

      - name: Lint
        run: pnpm lint
        continue-on-error: true
