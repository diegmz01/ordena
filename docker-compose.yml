services:
  postgres:
    image: postgres:16-alpine
    container_name: ordena-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ordena
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
